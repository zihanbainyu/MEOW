<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica Light, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-teal" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E9E8F"/>
    </marker>
    <marker id="ah-gold" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C58A1E"/>
    </marker>
    <marker id="ah-violet" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6A3FA0"/>
    </marker>
    <radialGradient id="glass" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#B9A7DE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7E5BB5" stop-opacity="0.10"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#FFFFFF"/>

  <!-- title -->
  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="300" fill="#26262f">Memory reinstatement is enacted through the eyes</text>

  <!-- ============ GLASS BRAIN ============ -->
  <path d="M250,300 C244,232 280,168 356,150 C448,128 566,128 664,162
           C742,190 786,238 780,296 C776,338 754,356 722,354
           C706,392 662,410 606,404 C566,418 512,420 470,404
           C430,418 372,420 330,402 C286,384 252,356 250,314 Z"
        fill="url(#glass)" stroke="#4B2081" stroke-width="2.2" stroke-opacity="0.85"/>
  <!-- gyri (glass texture) -->
  <g stroke="#7E5BB5" stroke-opacity="0.30" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M322,214 C362,194 402,236 442,214"/>
    <path d="M470,186 C512,212 552,182 592,208"/>
    <path d="M560,262 C602,242 642,278 682,256"/>
    <path d="M300,300 C346,284 382,316 424,300"/>
    <path d="M470,338 C512,320 556,352 598,332"/>
  </g>

  <!-- ============ REGION NODES ============ -->
  <!-- PFC -->
  <circle cx="345" cy="292" r="40" fill="#3F6FB0" fill-opacity="0.16"/>
  <circle cx="345" cy="292" r="15" fill="#3F6FB0"/>
  <text x="345" y="238" text-anchor="middle" font-size="18" font-weight="300" fill="#2E5487">PFC</text>
  <text x="345" y="256" text-anchor="middle" font-size="12.5" font-weight="300" fill="#6b6b6b">control · gaze</text>

  <!-- Visual cortex -->
  <circle cx="700" cy="300" r="40" fill="#2E9E8F" fill-opacity="0.16"/>
  <circle cx="700" cy="300" r="15" fill="#2E9E8F"/>
  <text x="712" y="246" text-anchor="middle" font-size="18" font-weight="300" fill="#1F7A6E">visual cortex</text>

  <!-- Hippocampus (with a small seahorse curl) -->
  <circle cx="505" cy="372" r="42" fill="#E0A82E" fill-opacity="0.18"/>
  <path d="M492,384 C486,372 496,362 508,364 C520,366 524,378 516,384 C511,388 504,386 503,380"
        fill="none" stroke="#B8811A" stroke-width="4.5" stroke-linecap="round"/>
  <text x="505" y="432" text-anchor="middle" font-size="18" font-weight="300" fill="#9A6B12">hippocampus</text>

  <!-- ============ EYE (front) ============ -->
  <g>
    <path d="M72,300 Q118,262 164,300 Q118,338 72,300 Z" fill="#FFFFFF" stroke="#26262f" stroke-width="2"/>
    <circle cx="106" cy="300" r="22" fill="#4B2081"/>
    <circle cx="106" cy="300" r="9.5" fill="#141018"/>
    <circle cx="99" cy="292" r="3.6" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- incoming light from the world -->
    <g stroke="#2E9E8F" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <line x1="20" y1="284" x2="52" y2="292"/>
      <line x1="16" y1="300" x2="50" y2="300"/>
      <line x1="20" y1="316" x2="52" y2="308"/>
    </g>
    <text x="60" y="356" text-anchor="middle" font-size="13" font-weight="300" fill="#6b6b6b">eye</text>
  </g>

  <!-- ============ CIRCUIT ARROWS ============ -->
  <!-- A. visual input: eye -> visual cortex (over the top) -->
  <path d="M150,262 C320,150 520,128 686,240" fill="none" stroke="#2E9E8F" stroke-width="3"
        marker-end="url(#ah-teal)"/>
  <text x="452" y="118" text-anchor="middle" font-size="15.5" font-weight="300" fill="#1F7A6E">visual input</text>

  <!-- B. encoding: visual cortex -> hippocampus (lower arc) -->
  <path d="M688,320 C636,352 576,368 532,366" fill="none" stroke="#2E9E8F" stroke-width="3"
        marker-end="url(#ah-teal)"/>
  <text x="612" y="392" text-anchor="middle" font-size="15.5" font-weight="300" fill="#1F7A6E">encoding</text>

  <!-- reinstatement: hippocampus -> visual cortex (upper dashed) -->
  <path d="M522,356 C576,336 630,320 682,306" fill="none" stroke="#C58A1E" stroke-width="2.6"
        stroke-dasharray="7 6" marker-end="url(#ah-gold)"/>

  <!-- reinstatement: hippocampus -> PFC -->
  <path d="M486,360 C442,344 402,322 368,304" fill="none" stroke="#C58A1E" stroke-width="3"
        marker-end="url(#ah-gold)"/>
  <text x="430" y="300" text-anchor="middle" font-size="15.5" font-weight="300" fill="#9A6B12" transform="rotate(-24 430 300)">reinstatement</text>

  <!-- D. eye movement: PFC -> eye (lower-left) -->
  <path d="M330,306 C258,334 196,332 158,312" fill="none" stroke="#6A3FA0" stroke-width="3"
        marker-end="url(#ah-violet)"/>
  <text x="242" y="372" text-anchor="middle" font-size="15.5" font-weight="300" fill="#54318C">eye movement</text>
  <text x="242" y="390" text-anchor="middle" font-size="12.5" font-weight="300" fill="#8A78B0">gaze reinstatement</text>

  <!-- caption -->
  <text x="490" y="566" text-anchor="middle" font-size="14" font-weight="300" fill="#555">
    Reinstated memory (hippocampus &#8594; cortex, PFC) drives eye movements that re-sample the visual world.
  </text>
</svg>
